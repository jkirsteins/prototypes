<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>06 - Dueling</title>
    <style>
      html, body { margin: 0; height: 100%; background: #14161a; color: #cfd3da;
        font-family: ui-monospace, Menlo, monospace; }
      #wrap { display: flex; align-items: center; justify-content: center; height: 100%; }
      canvas { image-rendering: pixelated; background: #1b1e24; }
      #select { position: fixed; inset: 0; background: rgba(16,18,22,0.96);
        display: flex; flex-direction: column; align-items: center; justify-content: center; }
      #select[hidden] { display: none; }
      #select .cols { display: flex; gap: 48px; }
      #select .col { width: 300px; }
      #select .option { border: 1px solid #3a404c; padding: 10px 12px; margin: 8px 0; }
      #select .option.picked { border-color: #e6c229; }
      #select .col.active h2 { color: #e6c229; }
      #select .hint { color: #8a8f98; margin-top: 24px; }
      #select .bar { height: 4px; background: #4aa3df; }
      #help { position: fixed; inset: 0; background: rgba(16,18,22,0.9);
        display: flex; align-items: flex-start; justify-content: center; overflow-y: auto; }
      #help[hidden] { display: none; }
      #help .panel { max-width: 720px; margin: 40px 16px; padding: 20px 26px;
        background: #1e2229; border: 1px solid #3a404c; font-size: 13px; line-height: 1.5; }
      #help h1 { font-size: 17px; margin: 0 0 8px; }
      #help h1 .close { color: #8a8f98; font-size: 12px; font-weight: normal; }
      #help h2 { font-size: 14px; margin: 18px 0 4px; color: #e6c229; }
      #help table { border-collapse: collapse; margin-top: 8px; }
      #help th { text-align: left; color: #8a8f98; font-weight: normal; padding: 2px 10px 2px 0; }
      #help td { vertical-align: top; padding: 4px 10px 4px 0; border-top: 1px solid #2c313a; }
      #help td.l { color: #e6c229; white-space: nowrap; }
      #help td.p { color: #9b8cff; }
      #help td.t { color: #8a8f98; white-space: nowrap; }
      #help ul { margin: 6px 0; padding-left: 20px; color: #aab0ba; }
      #help .keys b { color: #e6c229; font-weight: normal; }
      #help .keys { margin: 4px 0; }
    </style>
  </head>
  <body>
    <div id="wrap"><canvas id="game" width="960" height="540"></canvas></div>
    <div id="help" hidden><div class="panel"></div></div>
    <div id="select" hidden>
      <h1>Choose the swords</h1>
      <div class="cols">
        <div class="col" data-col="p"><h2>You</h2></div>
        <div class="col" data-col="e"><h2>Opponent (AI)</h2></div>
      </div>
      <p class="hint">A/D switch column - W/S switch sword - 1/2 direct pick - Enter to duel</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
