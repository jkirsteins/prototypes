name: Deploy prototypes to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Must match the editor the Godot prototypes are authored in, or the export
  # templates will not match the project and the export fails.
  GODOT_VERSION: "4.7.1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "**/package-lock.json"
      - name: Detect Godot prototypes
        id: godot
        run: |
          if ls [0-9][0-9]-*/project.godot >/dev/null 2>&1; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Cache Godot
        if: steps.godot.outputs.needed == 'true'
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64
      - name: Install Godot
        if: steps.godot.outputs.needed == 'true' && steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p "$HOME/godot-bin"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$HOME/godot-bin/godot"
          chmod +x "$HOME/godot-bin/godot"
          # The .tpz is a zip whose payload sits under templates/.
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest"
          unzip -q templates.tpz
          mv templates/* "$dest/"
          rm -rf godot.zip templates.tpz templates
      - name: Put Godot on PATH
        if: steps.godot.outputs.needed == 'true'
        run: echo "$HOME/godot-bin" >> "$GITHUB_PATH"
      - name: Build and assemble prototypes
        run: |
          set -euo pipefail
          mkdir -p _site
          for dir in [0-9][0-9]-*/; do
            dir="${dir%/}"
            num="${dir%%-*}"
            echo "Building $dir -> _site/$num"
            if [ -f "$dir/package.json" ]; then
              (cd "$dir" && npm ci && npm run build)
            elif [ -f "$dir/project.godot" ]; then
              # --import first: a fresh checkout has no .godot/, and the export
              # needs the import cache to exist before it can pack anything.
              (cd "$dir" \
                && mkdir -p dist \
                && godot --headless --import \
                && godot --headless --export-release Web dist/index.html)
            else
              echo "::error::$dir has neither package.json nor project.godot, so it cannot be built"
              exit 1
            fi
            mkdir -p "_site/$num"
            cp -R "$dir/dist/." "_site/$num/"
          done
          cp .github/pages-index.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
