<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>08 - Survidle</title>
  </head>
  <body>
    <div id="app">
      <aside id="left" class="col">
        <section id="stats" class="panel"></section>
        <section id="gear" class="panel"></section>
        <section id="skills" class="panel"></section>
      </aside>
      <main id="center" class="col">
        <section id="clock" class="panel"></section>
        <section id="map" class="panel">
          <div id="mapdyn"></div>
          <div class="legend"></div>
        </section>
        <section id="region" class="panel"></section>
      </main>
      <aside id="right" class="col">
        <section id="task" class="panel"></section>
        <section id="forecast" class="panel"></section>
        <div id="away" class="panel">
          <label>away up to <input type="range" min="1" max="24" step="1" data-away="hours" aria-label="hours away" /> <b data-away="label"></b></label>
          <button type="button" class="mini" data-act="manual-open">how to survive</button>
          <button type="button" class="mini" data-act="settings-open">settings</button>
        </div>
        <section id="log" class="panel"></section>
        <section id="actions" class="panel">
          <h2>Do</h2>
          <input type="search" data-do="filter" placeholder="filter" />
          <div id="dorows"></div>
        </section>
        <section id="inventory" class="panel"></section>
        <section id="journal" class="panel"></section>
      </aside>
    </div>
    <footer id="build" class="build"></footer>
    <div id="settings" class="panel" hidden>
      <h2>Settings <button type="button" class="mini" data-act="settings-close">close</button></h2>
      <div id="sound">
        <button type="button" data-sound="mute">Sound</button>
        <input type="range" min="0" max="100" step="1" data-sound="volume" aria-label="volume" />
        <label><input type="checkbox" data-sound="ambience" /> ambience</label>
        <span class="dim" data-sound="note"></span>
      </div>
      <div id="beacon">
        <label><input type="checkbox" data-beacon="on" /> share anonymous play data</label>
        <span class="dim" data-beacon="note"></span>
      </div>
    </div>
    <div id="overlay" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
