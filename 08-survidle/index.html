<!doctype html>
<html lang="en" data-loading="true">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>08 - Survidle</title>
    <style>
      html[data-loading="true"] body > :not(#loading) { visibility: hidden; pointer-events: none; }
      #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0c0f13; color: #c9cdd2; font-family: monospace; z-index: 50; }
      #loading[hidden] { display: none; }
    </style>
  </head>
  <body>
    <!-- Shown while the worker solves the world; the run does not start until it is done. -->
    <div id="loading" role="status" aria-live="polite"><div class="bar"><i></i></div><p>Loading...</p></div>
    <!-- The sync banner: over the page whenever this device is not the one
         running the world (another device holds it, the store is out of
         reach, or it was taken over). Rendered through setPanel; hidden
         when it has nothing to say. -->
    <div id="syncbanner" class="panel" role="status" hidden></div>
    <!-- Stocks span the page above the columns: what the camp holds, what it
         can hold, and which way each is moving. The map's own inventory strip
         answers a different question and stays where it is. Positioned so
         the opened panel can anchor under the strip rather than the page. -->
    <div id="stockswrap">
      <div id="stocks"></div>
      <!-- One element, in the markup from the start, so it is shown and
           hidden rather than created and destroyed under the pointer. -->
      <div id="stockpanel" hidden></div>
    </div>
    <!-- Left is info, middle is interactive, right is the queue. The left
         column is read-only but for the away slider, which only changes what
         is being read beside it. -->
    <div id="app">
      <aside id="left" class="col">
        <section id="opportunities" class="panel"></section>
        <section id="shopping" class="panel"></section>
        <section id="stats" class="panel"></section>
        <section id="forecastbox" class="panel">
          <h2>If you leave</h2>
          <b data-away="label"></b>
          <div id="forecast"></div>
          <div id="away">
            <input type="range" min="1" max="24" step="1" data-away="hours" aria-label="hours away" />
            <button type="button" class="mini" data-act="manual-open">how to survive</button>
            <button type="button" class="mini" data-act="settings-open">settings</button>
          </div>
        </section>
        <section id="skills" class="panel"></section>
      </aside>
      <main id="center" class="col">
        <section id="map" class="panel">
          <!-- The effects canvas (water shimmer, cloud shadow, weather
               motion) is mapHtml's own markup, inside .scroll-x, so it
               shares that element's isolated stacking context and its
               z-index is actually comparable to the route line and the
               marks - not a sibling of mapdyn, which would sit outside
               the isolation boundary and paint over everything. -->
          <div id="mapdyn"></div>
          <!-- Camp stores stay visible on the map; a non-empty cell under
               the pointer joins them while it is highlighted. -->
          <div id="mapinventory"></div>
          <!-- One element, in the markup from the start, so it is shown and
               hidden rather than created and destroyed under the pointer. -->
          <div id="maptip" hidden></div>
          <!-- The ways out, in a corner of the ground they lead off. On touch,
               where there is no hover to explain a glyph, the legend is folded
               behind this button so the board keeps the screen; a tap on a cell
               names its ground anyway. -->
          <button type="button" class="mini legendtoggle" data-act="legend-toggle" aria-expanded="false">legend</button>
          <div class="legend"></div>
        </section>
        <section id="task" class="panel"></section>
        <!-- The tab container, where the HERE panel used to be. All four
             panes exist at once and three are hidden: rendering one on demand
             would destroy the other three and the scroll position each holds. -->
        <section id="panes" class="panel">
          <div id="panetabs" class="tabs"></div>
          <div id="pane-do" class="pane">
            <div class="dofind">
              <input type="search" data-do="filter" placeholder="filter actions" aria-label="Filter actions" />
              <button type="button" class="mini" data-act="do-clear" title="Back to what the game is asking for">clear</button>
            </div>
            <div id="dosubs" class="subs"></div>
            <div class="dosplit">
              <div id="dopurposes"></div>
              <div id="doitems"></div>
            </div>
          </div>
          <div id="pane-camp" class="pane" hidden><div id="camp"></div></div>
          <div id="pane-pack" class="pane" hidden><div id="inventory"></div></div>
          <div id="pane-gear" class="pane" hidden><div id="gear"></div></div>
          <div id="pane-log" class="pane" hidden><div id="log"></div></div>
          <div id="pane-journal" class="pane" hidden><div id="journal"></div></div>
        </section>
      </main>
      <aside id="right" class="col">
        <div id="rightpages"></div>
        <section id="alerts" class="panel" hidden></section>
        <section id="weather" class="panel"></section>
        <section id="orders" class="panel"></section>
      </aside>
    </div>
    <footer id="build" class="build"></footer>
    <div id="settings" class="panel" hidden>
      <h2>Settings <button type="button" class="mini" data-act="settings-close">close</button></h2>
      <div id="sound">
        <button type="button" data-sound="mute">Sound</button>
        <input type="range" min="0" max="100" step="1" data-sound="volume" aria-label="volume" />
        <label><input type="checkbox" data-sound="ambience" /> ambience</label>
        <span class="dim" data-sound="note"></span>
      </div>
      <label>Travel estimates
        <select data-display="travel">
          <option value="distance">distance</option>
          <option value="time">time</option>
          <option value="both">distance and time</option>
        </select>
      </label>
      <label><input type="checkbox" data-display="cloud-shadows" checked /> clouds cast map shadows</label>
      <label>rates read in
        <select data-display="rates">
          <option value="game">game time (per hour)</option>
          <option value="real">real time (per second)</option>
        </select>
      </label>
      <div id="beacon">
        <label><input type="checkbox" data-beacon="on" /> share anonymous play data</label>
        <span class="dim" data-beacon="note"></span>
      </div>
      <!-- Sync across devices: static markup mounted once, like the beacon's. -->
      <div id="sync">
        <div><b>Sync across devices</b> <span class="dim" data-sync="line"></span></div>
        <div data-sync="actions"></div>
      </div>
      <div><button type="button" class="mini bad" data-act="reset-world">reset world data</button></div>
    </div>
    <div id="overlay" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
